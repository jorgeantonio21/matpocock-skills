[package]
name = "idiomatic-rust-examples"
version = "0.1.0"
edition = "2024"
publish = false
description = "The complete, compiled form of every example in INVARIANTS.md."

[dependencies]
bon = "3.10.0"
core_affinity = "0.8.3"
derive_more = { version = "2.1.1", features = ["display", "from", "into"] }
dynosaur = "0.3.1"
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "time", "signal", "sync", "test-util"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
trait-variant = "0.1.3"
zerocopy = { version = "0.8.56", features = ["derive"] }

[dev-dependencies]
anyhow = "1.0.100"
rstest = "0.26.1"
